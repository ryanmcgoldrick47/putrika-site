name: Instagram sync

on:
  schedule:
    - cron: '17 19 * * *'   # every day around 6am Sydney time
  workflow_dispatch: {}      # "Run workflow" button for a manual refresh

permissions:
  contents: write
  pages: write

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest Instagram posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/ig_sync.py

      - name: Save refreshed token
        if: hashFiles('.ig_new_token') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" < .ig_new_token && echo "IG_TOKEN updated"
          else
            echo "::warning::Instagram gave a new token but GH_SECRETS_TOKEN is not set, so it was not saved."
          fi
          rm -f .ig_new_token

      - name: Commit changes
        id: commit
        run: |
          git config user.name "putrika-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ig
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Instagram sync $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
